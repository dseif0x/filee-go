name: release-macos
# On a version tag: Filee.app (universal: Apple silicon and Intel), signed ad hoc on a macOS runner,
# attached to a draft release. Public distribution needs Developer ID signing and notarization.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  app:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -tags=nodynamic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test the macOS parts
        run: go test -timeout 600s ./internal/donut/... ./internal/gui/... ./internal/macos/...
      - name: Build Filee.app
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-macos-app.sh
      - name: Self-test the bindings
        # A runner has a window server but no permissions: the checks that need one say "skipped".
        run: ./dist/Filee.app/Contents/MacOS/Filee app --selftest || true
      - uses: actions/upload-artifact@v4
        with:
          name: Filee-macos
          path: dist/*.zip
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "Filee $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
